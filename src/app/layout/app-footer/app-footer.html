<footer class="app-footer" role="contentinfo" aria-label="پاورقی سایت">
  <div class="footer-inner">
    <div class="brand-wrapper">
      <div class="brand-icon">
        <img src="/Logo.jpg" alt="لوگوی رزومه‌ساز" class="logo-image" width="44" height="44" loading="lazy">
      </div>
      <div class="brand-text">
        <p class="footer-credit">
          {{ footer.credit }}
          <strong>{{ footer.author }}</strong>
        </p>
        <p class="footer-tagline">رزومه‌ساز فارسی — راست‌چین و خروجی PDF</p>
      </div>
    </div>

    <nav class="footer-links" aria-label="لینک‌های ارتباطی">
      @for (link of footer.links; track link.url) {
      <a [href]="link.url" target="_blank" rel="noopener noreferrer" class="footer-link"
        [attr.aria-label]="link.label + ' (لینک خارجی)'">
        <span class="footer-link-icon" aria-hidden="true">
          <app-resume-icon [name]="link.icon" [size]="18" />
        </span>
        <span>{{ link.label }}</span>
      </a>
      }
    </nav>
  </div>

  <div class="footer-bottom">
    <p class="footer-copy">
      © {{ year }} — ساخته‌شده با ❤️
      <span class="donation-note">
        —
        <a href="https://daramet.com/Afsh5n" target="_blank" rel="noopener noreferrer" class="donation-link"
          aria-label="حمایت مالی از پروژه">
          اگر مفید بود، حمایت کنید ☕️
        </a>
      </span>
    </p>
  </div>
</footer>
